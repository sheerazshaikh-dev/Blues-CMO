<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in | Blues CMO</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{font-family:Manrope,system-ui,-apple-system,sans-serif;color:#1e2b3a;background:#f3f8fb}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.primary{background:#233b50;border:0;color:white;padding:13px 20px;border-radius:12px;font-weight:750}.secondary{border:1px solid #dce7ed;background:white;padding:11px 16px;border-radius:12px;color:#233b50;font-weight:700}button:disabled{opacity:.5;cursor:wait}input{border:1px solid #c5d8e2;padding:13px 15px;border-radius:12px;background:white;min-width:0}input:focus{outline:2px solid #2a8cb0}a{color:#1f7899}h1,h2,p{margin-top:0}main{min-height:100vh;display:grid;place-items:center;padding:24px}.panel{background:white;width:min(100%,440px);border:1px solid #dce7ed;padding:38px;border-radius:22px;box-shadow:0 18px 55px #18334612}.tag{color:#238cad;font-size:12px;text-transform:uppercase;font-weight:800;letter-spacing:2px}.panel h1{font-size:30px;margin:12px 0}.panel p{color:#657688;line-height:1.5}.group{margin:22px 0;display:grid;gap:7px}.group label{font-weight:750;font-size:13px}.group input{width:100%}.primary{width:100%}#error{min-height:22px;color:#b02842;font-size:13px;margin:12px 0}</style></head><body><main><div class="panel"><div class="tag">Blues CMO / Admin</div><h1>Welcome back.</h1><p>Sign in to view founding-member submissions and interview notes.</p><form id="login"><div class="group"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required maxlength="254"></div><div class="group"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><p id="error" role="alert"></p><button class="primary" id="submit">Sign in</button></form><p style="font-size:12px;margin:22px 0 0"><a href="/">← Back to founding preview</a></p></div></main><script>document.getElementById('login').addEventListener('submit',async(e)=>{e.preventDefault();const b=document.getElementById('submit'),error=document.getElementById('error');b.disabled=true;b.textContent='Signing in…';error.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Sign in failed');location.replace('/admin')}catch(e){error.textContent=e.message;b.disabled=false;b.textContent='Sign in'}});</script></body></html>
